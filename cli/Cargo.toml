[package]
name = "grobx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# cli.1 practice-checked: library and thin binary -- a library reads the arguments and the outcome, and the binary reads the files, calls, writes, and takes SIGINT, not the binary alone (not measured)
# test-build-time.5 design-checked -- the lib, which holds no unit test, is compiled as no test binary, not as a test binary that lists no test (log 0019-1)
[lib]
name = "grobx_cli"
test = false
doctest = false

# The binary is named grobx, as the core's lib is: doc = false keeps their
# documentation from colliding.
[[bin]]
name = "grobx"
path = "src/main.rs"
test = false
doc = false

[dependencies]
grobx = { path = "..", default-features = false }

# The core's features, passed on: a build without one leaves it out of the
# core (`../Cargo.toml`, `[features]`).
[features]
default = ["cofactors", "checker"]
cofactors = ["grobx/cofactors"]
checker = ["cofactors", "grobx/checker"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true
